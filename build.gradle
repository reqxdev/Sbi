plugins {
	id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
	id 'java-library'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.shedaniel.me' ; name = 'shedaniel' } // REI
	maven { url = 'https://repo.nea.moe/releases' ; name = 'nea.moe' } // neurepoparser
	maven { url = 'https://maven.architectury.dev/' ; name = 'Architectury' } // EventResult, used by REI's visibility predicate API
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.2 is unobfuscated - Fabric's official porting guide says to remove the
	// mappings line entirely (no obfuscation maps needed) and use plain implementation
	// instead of modImplementation for mod dependencies, since there's no remap step.
	// https://docs.fabricmc.net/develop/porting/

	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	// Point/Rectangle (me.shedaniel.math) used by REI's category/display API live in this
	// separate library, not inside the REI jar itself - REI depends on it too but doesn't
	// shade/bundle it, so consumers need to declare it themselves.
	implementation "me.shedaniel.cloth:basic-math:0.6.1"
	// Only needed for EventResult (used by REI's CategoryVisibilityPredicate API to hide
	// the vanilla crafting category) - REI itself depends on this too at runtime.
	implementation "dev.architectury:architectury-fabric:21.0.2"

	// Plain Java library, no Kotlin runtime pulled in.
	implementation "moe.nea:neurepoparser:${project.neurepoparser_version}"
	include "moe.nea:neurepoparser:${project.neurepoparser_version}"
}

processResources {
	inputs.property "version", project.version
	filteringCharset = "UTF-8"
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = targetJavaVersion
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
	withSourcesJar()
}
