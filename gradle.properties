org.gradle.jvmargs=-Xmx2048M

# Verified 26.1.2 (world_version 4790) and 26.2 (world_version 4903) are API-identical for
# every class this mod touches (Identifier, BuiltInRegistries, ItemStack/Items, and the full
# REI plugin/category/entry/slot API) - decompiled both and diffed. Compiling against the
# older of the two is the safer default: a mod built against 26.1.2 runs fine on 26.2 as long
# as nothing it uses changed, which we've confirmed; the reverse isn't guaranteed.
minecraft_version=26.1.2
loom.platform=fabric

# Loom 1.10 bundles an ASM version that can't parse Java 25 class files (major version 69),
# which is what MC 26.1.2/26.2's jars are compiled with - this caused
# "Unsupported class file major version 69" during jar merging. 1.15-SNAPSHOT is confirmed
# working for 26.1.2 in storage-overlay-mod. (Also hardcoded directly in build.gradle's
# plugins{} block, since Loom itself must be resolved before dependency resolution can read
# this file - this line is just documentation of what that value is and why.)

fabric_loader_version=0.19.3

# Fabric API version tag - verify against https://modrinth.com/mod/fabric-api/versions
# for whichever minecraft_version you compile against above. This is compile-time only
# (declared as implementation, not include) - end users' own installed Fabric API,
# matching whichever of 26.1.2/26.2 they're running, is what applies at runtime.
fabric_api_version=0.154.0+26.1.2

# REI - compiled against the 26.1.2 build (RoughlyEnoughItems-26_1_819.jar you supplied);
# confirmed API-identical to the 26.2 build for every class this mod uses.
rei_version=26.1.819

# neurepoparser - version-independent, this is just JSON parsing, not MC APIs
neurepoparser_version=1.11.0

mod_version=1.0.3
maven_group=moe.example.skyblockrecipeviewer
archives_base_name=skyblock-recipe-viewer
